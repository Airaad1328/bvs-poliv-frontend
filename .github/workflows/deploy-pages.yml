name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure deployment path
        shell: bash
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          OWNER_NAME="${GITHUB_REPOSITORY%%/*}"

          echo "REPO_NAME=$REPO_NAME" >> "$GITHUB_ENV"

          if [[ "$REPO_NAME" == "${OWNER_NAME}.github.io" ]]; then
            echo "BASE_PATH=" >> "$GITHUB_ENV"
            echo "VITE_SITE_URL=https://${OWNER_NAME}.github.io" >> "$GITHUB_ENV"
          else
            echo "BASE_PATH=/$REPO_NAME" >> "$GITHUB_ENV"
            echo "VITE_SITE_URL=https://${OWNER_NAME}.github.io/$REPO_NAME" >> "$GITHUB_ENV"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.22.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Prepare GitHub Pages output
        shell: bash
        run: |
          # Некоторые версии React Router при basename
          # помещают prerendered HTML в build/client/<repo>.
          # Перемещаем его содержимое в корень Pages artifact.
          if [[ -n "$BASE_PATH" ]] && \
             [[ -d "build/client${BASE_PATH}" ]]; then

            cp -a "build/client${BASE_PATH}/." build/client/
            rm -rf "build/client${BASE_PATH}"
          fi

          # GitHub Pages использует 404.html для неизвестных URL.
          if [[ -f build/client/__spa-fallback.html ]]; then
            cp \
              build/client/__spa-fallback.html \
              build/client/404.html
          fi

          touch build/client/.nojekyll

          echo "Published files:"
          find build/client \
            -maxdepth 3 \
            -type f \
            | sort \
            | head -100

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    needs:
      - build

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5